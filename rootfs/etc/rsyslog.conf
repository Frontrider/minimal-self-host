# rsyslog is the log aggregator for the s6 services. Each *-log service pipes its producer's output
# into logger(1), which sends it to /dev/log. Every program gets one file at /var/log/<program>/current,
# the same place s6-log wrote to.
module(load="imuxsock" SysSock.Name="/dev/log")

template(name="ServiceLine" type="string" string="%timegenerated:::date-rfc3339% %msg:::drop-last-lf%\n")
template(name="ServiceFile" type="string" string="/var/log/%programname%/current")

*.* action(type="omfile" dynaFile="ServiceFile" template="ServiceLine")
