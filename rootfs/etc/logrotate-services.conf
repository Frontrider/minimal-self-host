# Rotates the per-program logs written by rsyslog. Matches s6-log's old policy of keeping 10 archives
# of about 1 MB each. rsyslog is HUPed afterwards so it reopens the new current file.
/var/log/*/current {
    size 1000000
    rotate 10
    missingok
    notifempty
    nocompress
    sharedscripts
    create 0644 root root
    postrotate
        [ -f /run/rsyslogd.pid ] && kill -HUP "$(cat /run/rsyslogd.pid)" || true
    endscript
}
