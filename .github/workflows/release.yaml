name: Release Docker image

on:
  release:
    types: [published]
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Semantic version to publish (e.g. 1.2.3 or 1.2.3-rc.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency:
      group: docker-release-${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}

      - name: Validate release version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
        run: |
          version="$RELEASE_TAG"
          if ! printf '%s\n' "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*))?$'; then
            echo "Use a semantic version such as 1.2.3 or 1.2.3-rc.1. Build metadata is not supported in Docker tags." >&2
            exit 1
          fi
          if [ "${#version}" -gt 122 ]; then
            echo "Version cannot exceed 122 characters so the derived Docker tags fit Docker's 128-character limit." >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            printf 'stable=false\n' >> "$GITHUB_OUTPUT"
          else
            printf 'stable=true\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Validate Docker Hub configuration
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "Set the DOCKERHUB_USERNAME repository variable or secret." >&2
            exit 1
          fi
          if [ -z "$DOCKERHUB_REPOSITORY" ]; then
            echo "Set the DOCKERHUB_REPOSITORY repository variable to the Docker Hub repository name." >&2
            exit 1
          fi
          if ! printf '%s' "$DOCKERHUB_REPOSITORY" | grep -Eq '^[a-z0-9]+([._-][a-z0-9]+)*$'; then
            echo "DOCKERHUB_REPOSITORY must be a valid Docker Hub repository name: lowercase alphanumeric with '.', '_' or '-' separators." >&2
            exit 1
          fi

      - name: Extract Docker image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ steps.version.outputs.stable == 'true' }}

      - name: Sign in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up ARM emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.version }}
          IMAGE: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY }}:${{ steps.meta.outputs.version }}
          LATEST_IMAGE: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY }}:latest
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.version.outputs.version }}
          STABLE: ${{ steps.version.outputs.stable }}
          COMMIT: ${{ github.sha }}
        run: |
          latest_row=""
          latest_pull=""
          if [ "$STABLE" = "true" ]; then
            latest_row="| Latest | \`$LATEST_IMAGE\` |"$'\n'
            latest_pull="docker pull $LATEST_IMAGE"$'\n'
          fi
          notes="## Docker images

          | Platform | Image |
          | --- | --- |
          | Automatic (AMD64 / ARM64) | \`$IMAGE\` |
          ${latest_row}| Digest | \`$IMAGE@$DIGEST\` |

          Pull with:
          \`\`\`sh
          docker pull $IMAGE
          ${latest_pull}\`\`\`"
          existing="$(gh api --paginate "repos/$GH_REPO/releases" --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .tag_name")"
          if [ -n "$existing" ]; then
            body="$(gh release view "$RELEASE_TAG" --json body --jq '.body')"
            if [[ "$body" != *"$notes"* ]]; then
              gh release edit "$RELEASE_TAG" --notes "${body}${body:+$'\n\n'}$notes"
            fi
          else
            arguments=(--target "$COMMIT" --title "$RELEASE_TAG" --generate-notes --notes "$notes")
            if [[ "$VERSION" == *-* ]]; then
              arguments+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "${arguments[@]}"
          fi
          printf '%s\n' "$notes" >> "$GITHUB_STEP_SUMMARY"
